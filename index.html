<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Youtuj — Profile Gallery</title>
<style>
  :root{
    --bg:#0a0908;
    --bg-elev:#141210;
    --gold:#c9a24b;
    --gold-soft:#e8d5a3;
    --teal:#2f6f6a;
    --teal-soft:#7fc4bd;
    --text:#ece7dd;
    --text-dim:#948d7f;
    --border:rgba(201,162,75,0.18);
    --radius:50%;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 800px at 15% -10%, rgba(47,111,106,0.14), transparent 60%),
      radial-gradient(900px 700px at 105% 10%, rgba(201,162,75,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Cormorant Garamond', Georgia, serif;
    min-height:100vh;
  }
  @font-face{
    font-family:'Cormorant Garamond';
    src:local('Cormorant Garamond');
  }

  header.hero{
    padding:64px 24px 40px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }
  header.hero .eyebrow{
    font-family:'Cinzel', Georgia, serif;
    font-size:12px;
    letter-spacing:0.28em;
    color:var(--teal-soft);
    margin-bottom:14px;
  }
  header.hero h1{
    font-family:'Cinzel', Georgia, serif;
    font-weight:600;
    font-size:clamp(28px,5vw,46px);
    margin:0 0 10px;
    color:var(--gold-soft);
    letter-spacing:0.02em;
  }
  header.hero p{
    color:var(--text-dim);
    font-size:16px;
    max-width:480px;
    margin:0 auto;
  }

  main{
    max-width:1240px;
    margin:0 auto;
    padding:40px 20px 20px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:26px 20px;
  }
  @media(min-width:700px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(170px,1fr));}
  }

  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    outline-offset:4px;
  }
  .card:focus-visible{outline:2px solid var(--gold);}

  .thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:var(--radius);
    overflow:hidden;
    background:linear-gradient(160deg,#1b1815,#0e0c0a);
    border:1px solid var(--border);
    position:relative;
    transition:border-color .25s ease, transform .25s ease;
  }
  .card:hover .thumb, .card:focus-visible .thumb{
    border-color:var(--gold);
    transform:translateY(-3px);
  }
  .thumb img, .thumb video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .45s ease;
  }
  .thumb img.loaded, .thumb video.loaded{opacity:1;}

  .thumb .placeholder{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
    font-size:11px;
    letter-spacing:.1em;
  }
  .thumb .placeholder::after{
    content:'';
    width:22px;height:22px;
    border-radius:50%;
    border:2px solid rgba(201,162,75,0.25);
    border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .video-badge{
    position:absolute;
    bottom:8px;right:8px;
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(10,9,8,0.72);
    border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    z-index:2;
  }
  .video-badge svg{width:11px;height:11px;fill:var(--gold-soft);}

  /* Pagination */
  .pagination{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    padding:48px 12px 64px;
  }
  .pagination button{
    min-width:40px;
    height:40px;
    padding:0 12px;
    border-radius:10px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Cinzel', Georgia, serif;
    font-size:13px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .pagination button:hover{border-color:var(--gold);color:var(--gold-soft);}
  .pagination button.active{
    background:linear-gradient(160deg, rgba(201,162,75,0.22), rgba(47,111,106,0.14));
    border-color:var(--gold);
    color:var(--gold-soft);
  }
  .pagination button:disabled{opacity:0.35;cursor:default;}

  .status-bar{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:.05em;
    margin-top:-8px;
    padding-bottom:8px;
  }

  /* Lightbox */
  .lightbox{
    position:fixed;inset:0;
    background:rgba(4,4,3,0.96);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox-content{
    max-width:min(92vw, 900px);
    max-height:88vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lightbox-content img, .lightbox-content video{
    max-width:100%;
    max-height:88vh;
    border-radius:6px;
    box-shadow:0 30px 90px rgba(0,0,0,0.6);
  }
  .lb-btn{
    position:absolute;
    background:rgba(20,18,16,0.7);
    border:1px solid var(--border);
    color:var(--gold-soft);
    width:46px;height:46px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:20px;
    line-height:1;
    transition:border-color .2s ease;
  }
  .lb-btn:hover{border-color:var(--gold);}
  .lb-close{top:20px;right:20px;}
  .lb-prev{left:20px;top:50%;transform:translateY(-50%);}
  .lb-next{right:20px;top:50%;transform:translateY(-50%);}
  @media(max-width:640px){
    .lb-prev{left:8px;}
    .lb-next{right:8px;}
    .lb-close{top:12px;right:12px;}
  }

  .empty-note{
    text-align:center;
    color:var(--text-dim);
    padding:60px 20px;
    font-size:15px;
  }

  ::selection{background:rgba(201,162,75,0.3);}
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">INFINITEPROFILE</div>
  <h1>Youtuj</h1>
  <p>A quiet archive of faces.</p>
</header>

<main>
  <div id="grid" class="grid" role="list" aria-label="Profile gallery"></div>
  <div id="statusBar" class="status-bar"></div>
  <nav id="pagination" class="pagination" aria-label="Gallery pages"></nav>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <div class="lightbox-content" id="lbContent"></div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">›</button>
</div>

  /* ====================================================== */

  const grid = document.getElementById('grid');
  const paginationEl = document.getElementById('pagination');
  const statusBar = document.getElementById('statusBar');
  const lightbox = document.getElementById('lightbox');
  const lbContent = document.getElementById('lbContent');
  const lbClose = document.getElementById('lbClose');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');

  const totalPages = Math.max(1, Math.ceil(ITEMS.length / PAGE_SIZE));
  let currentPage = 1;
  let currentPageItems = [];
  let currentIndexInPage = -1;
  let observer = null;

  function urlFor(filename){
    return BASE_URL + encodeURIComponent(filename).replace(/%2F/g, '/');
  }

  function unloadObserver(){
    if(observer){
      observer.disconnect();
      observer = null;
    }
  }

  function renderPage(page){
    unloadObserver();
    currentPage = Math.min(Math.max(1, page), totalPages);

    // Fully clear previous page's DOM/media to free memory on low-RAM devices
    grid.innerHTML = '';

    const start = (currentPage - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, ITEMS.length);
    currentPageItems = ITEMS.slice(start, end);

    if(currentPageItems.length === 0){
      grid.innerHTML = '<div class="empty-note">No profiles on this page.</div>';
    }

    const frag = document.createDocumentFragment();

    currentPageItems.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role','listitem');
      card.tabIndex = 0;
      card.dataset.idx = idx;

      const thumb = document.createElement('div');
      thumb.className = 'thumb';

      const placeholder = document.createElement('div');
      placeholder.className = 'placeholder';
      thumb.appendChild(placeholder);

      if(item.v){
        const badge = document.createElement('div');
        badge.className = 'video-badge';
        badge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        thumb.appendChild(badge);
      }

      thumb.dataset.src = urlFor(item.f);
      thumb.dataset.isVideo = item.v ? '1' : '0';

      const openHandler = () => openLightbox(idx);
      card.addEventListener('click', openHandler);
      card.addEventListener('keypress', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openHandler(); }
      });

      card.appendChild(thumb);

      const name = NAME_MAP[item.f];
      if(name){
        const label = document.createElement('div');
        label.style.marginTop = '10px';
        label.style.fontSize = '13px';
        label.style.color = 'var(--text-dim)';
        label.style.letterSpacing = '.03em';
        label.textContent = name;
        card.appendChild(label);
      }

      frag.appendChild(card);
    });

    grid.appendChild(frag);

    // Lazy-load: only fetch media once its card scrolls near the viewport
    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          loadThumb(entry.target);
          observer.unobserve(entry.target);
        }
      });
    }, { root: null, rootMargin: '400px 0px', threshold: 0.01 });

    grid.querySelectorAll('.thumb').forEach(el => observer.observe(el));

    renderPagination();
    updateStatus();
    window.scrollTo({top: 0, behavior: 'instant' in window ? 'instant' : 'auto'});
  }

  function loadThumb(thumbEl){
    const src = thumbEl.dataset.src;
    const isVideo = thumbEl.dataset.isVideo === '1';
    let el;
    if(isVideo){
      el = document.createElement('video');
      el.muted = true;
      el.playsInline = true;
      el.preload = 'metadata';
      el.src = src + '#t=0.1';
    } else {
      el = document.createElement('img');
      el.loading = 'lazy';
      el.decoding = 'async';
      el.alt = '';
      el.src = src;
    }
    el.addEventListener(isVideo ? 'loadeddata' : 'load', () => {
      el.classList.add('loaded');
      const ph = thumbEl.querySelector('.placeholder');
      if(ph) ph.remove();
    });
    el.addEventListener('error', () => {
      const ph = thumbEl.querySelector('.placeholder');
      if(ph){ ph.style.setProperty('--err','1'); ph.textContent = '—'; ph.style.animation='none'; ph.style.setProperty('font-size','20px'); ph.style.setProperty('color','var(--text-dim)'); }
    });
    thumbEl.appendChild(el);
  }

  function renderPagination(){
    paginationEl.innerHTML = '';

    const makeBtn = (label, page, opts={}) => {
      const b = document.createElement('button');
      b.textContent = label;
      if(opts.active) b.classList.add('active');
      if(opts.disabled) b.disabled = true;
      b.addEventListener('click', () => { if(!opts.disabled) renderPage(page); });
      return b;
    };

    paginationEl.appendChild(makeBtn('‹', currentPage - 1, {disabled: currentPage === 1}));

    for(let p = 1; p <= totalPages; p++){
      paginationEl.appendChild(makeBtn(String(p), p, {active: p === currentPage}));
    }

    paginationEl.appendChild(makeBtn('›', currentPage + 1, {disabled: currentPage === totalPages}));
  }

  function updateStatus(){
    const start = (currentPage - 1) * PAGE_SIZE + 1;
    const end = Math.min(currentPage * PAGE_SIZE, ITEMS.length);
    statusBar.textContent = `${start}–${end} of ${ITEMS.length} profiles · page ${currentPage} of ${totalPages}`;
  }

  /* ---------------- Lightbox ---------------- */

  function openLightbox(indexInPage){
    currentIndexInPage = indexInPage;
    renderLightboxContent();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lbContent.innerHTML = '';
    document.body.style.overflow = '';
  }

  function renderLightboxContent(){
    lbContent.innerHTML = '';
    const item = currentPageItems[currentIndexInPage];
    if(!item) return;
    const src = urlFor(item.f);
    let el;
    if(item.v){
      el = document.createElement('video');
      el.src = src;
      el.controls = true;
      el.autoplay = true;
      el.playsInline = true;
    } else {
      el = document.createElement('img');
      el.src = src;
      el.alt = '';
    }
    lbContent.appendChild(el);
  }

  function showNext(){
    if(currentPageItems.length === 0) return;
    currentIndexInPage = (currentIndexInPage + 1) % currentPageItems.length;
    renderLightboxContent();
  }
  function showPrev(){
    if(currentPageItems.length === 0) return;
    currentIndexInPage = (currentIndexInPage - 1 + currentPageItems.length) % currentPageItems.length;
    renderLightboxContent();
  }

  lbClose.addEventListener('click', closeLightbox);
  lbNext.addEventListener('click', showNext);
  lbPrev.addEventListener('click', showPrev);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') showNext();
    if(e.key === 'ArrowLeft') showPrev();
  });

  // Touch swipe navigation
  let touchStartX = null;
  lightbox.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, {passive:true});
  lightbox.addEventListener('touchend', (e) => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){ dx < 0 ? showNext() : showPrev(); }
    touchStartX = null;
  }, {passive:true});

  /* ---------------- Init ---------------- */
  renderPage(1);

})();
